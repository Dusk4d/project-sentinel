name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test and package with pinned Maven Wrapper
        run: ./mvnw --batch-mode --no-transfer-progress clean verify
      - name: Publish test failure diagnostics
        if: failure()
        shell: bash
        run: |
          found=false
          for report in target/surefire-reports/*.txt; do
            test -f "$report" || continue
            if grep -Eq 'Failures: [1-9]|Errors: [1-9]' "$report"; then
              found=true
              summary=$(tr '\n' ' ' < "$report" | cut -c1-4000)
              echo "::error file=$report,title=JUnit failure::$summary"
            fi
          done
          if ! $found; then
            echo "::error title=Maven failure::No failing Surefire text report was produced; inspect the Maven step."
          fi
      - name: Verify CLI artifact
        run: java -jar target/workspace-agent-*.jar --version
      - name: Verify distribution and checksum
        shell: bash
        run: |
          archive=$(find target -maxdepth 1 -name 'project-sentinel-*-distribution.zip' -print -quit)
          test -n "$archive"
          unzip -q "$archive" -d target/distribution-smoke
          root=$(find target/distribution-smoke -mindepth 1 -maxdepth 1 -type d -print -quit)
          test -n "$root"
          sh -n "$root/project-sentinel.sh" "$root/start-web.sh"
          "$root/project-sentinel.sh" --version
          sha256sum "$archive" > "$archive.sha256"
      - name: Upload verified distribution
        uses: actions/upload-artifact@v7
        with:
          name: project-sentinel
          path: |
            target/project-sentinel-*-distribution.zip
            target/project-sentinel-*-distribution.zip.sha256
          if-no-files-found: error
          retention-days: 14
