name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test and package with pinned Maven Wrapper
        run: ./mvnw --batch-mode --no-transfer-progress clean verify
      - name: Verify CLI artifact
        run: java -jar target/workspace-agent-0.2.0.jar --version
